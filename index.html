<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公證業務整合系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        textarea { resize: vertical; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo, useEffect } = React;

        // 複製小工具
        const copyToClipboard = (text, onSuccess) => {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
            } else {
                fallbackCopy(text, onSuccess);
            }
        };

        const fallbackCopy = (text, onSuccess) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                if (document.execCommand('copy')) onSuccess();
            } catch (err) {}
            document.body.removeChild(textArea);
        };

        const CopyBtn = ({ text, label = "一鍵複製" }) => {
            const [copied, setCopied] = useState(false);
            return (
                <button
                    onClick={() => copyToClipboard(text, () => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 1800);
                    })}
                    className={`inline-flex items-center space-x-1 px-3 py-1 rounded text-xs font-semibold transition-all shadow-sm ${
                        copied ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white hover:bg-blue-700'
                    }`}
                >
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        {copied ? (
                            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        ) : (
                            <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        )}
                    </svg>
                    <span>{copied ? '已複製' : label}</span>
                </button>
            );
        };

        // ------------------ 司法院公證費用標準表查表引擎 ------------------
        const getStandardFee = (amount, hasExec) => {
            if (amount === null || amount === undefined || isNaN(amount)) {
                return hasExec ? 1500 : 1000;
            }
            if (amount <= 200000) return hasExec ? 1500 : 1000;
            if (amount <= 500000) return hasExec ? 3000 : 2000;
            if (amount <= 1000000) return hasExec ? 4500 : 3000;
            if (amount <= 2000000) return hasExec ? 6000 : 4000;
            if (amount <= 5000000) return hasExec ? 7500 : 5000;
            if (amount <= 10000000) return hasExec ? 9000 : 6000;
            if (amount <= 20000000) return hasExec ? 12000 : 8000;
            if (amount <= 30000000) return hasExec ? 15000 : 10000;
            if (amount <= 40000000) return hasExec ? 18000 : 12000;
            if (amount <= 50000000) return hasExec ? 21000 : 14000;
            if (amount <= 60000000) return hasExec ? 22500 : 15000;
            if (amount <= 70000000) return hasExec ? 24000 : 16000;
            if (amount <= 80000000) return hasExec ? 25500 : 17000;
            if (amount <= 90000000) return hasExec ? 27000 : 18000;
            if (amount <= 100000000) return hasExec ? 28500 : 19000;
            return null; // 逾1億
        };

        // ------------------ 前台：回覆溝通工具 ------------------
        function FrontendReplyTool() {
            // 大類別：公證 / 認證
            const [mainCategory, setMainCategory] = useState('notary'); // 'notary' | 'attest'
            const [subCategory, setSubCategory] = useState('lease'); // 'lease','loan','divorce' OR 'private','public','copy','trans'

            const handleMainChange = (cat) => {
                setMainCategory(cat);
                if (cat === 'notary') setSubCategory('lease');
                else setSubCategory('private');
            };

            // 1. 【應到場人】相關狀態
            // 租賃與借貸
            const [landlordType, setLandlordType] = useState('p_self'); // p_self, p_agent, c_self, c_agent
            const [tenantType, setTenantType] = useState('p_self');
            const [leaseGuarantor, setLeaseGuarantor] = useState('none'); // 'none' (無) | 'has' (有)
            const [lenderType, setLenderType] = useState('p_self');
            const [borrowerType, setBorrowerType] = useState('p_self');
            const [loanGuarantor, setLoanGuarantor] = useState('none'); // 'none' (無) | 'has' (有)

            // 認證：請求人到場身分 (個人親到, 個人親屬, 個人代理, 公司親到, 公司代理)
            const [attestRequesterType, setAttestRequesterType] = useState('p_self'); 

            // 2. 【應備文件】相關狀態
            const [leaseContractType, setLeaseContractType] = useState('template'); // 'template'(範本) | 'self'(自備)
            const [loanIsPaid, setLoanIsPaid] = useState(false); // 借貸金流現況: false (事前交款) | true (事後金流)
            const [divorceHasChild, setDivorceHasChild] = useState(true); // 離婚未成年子女: true (有) | false (無)
            const [attestRegion, setAttestRegion] = useState('foreign'); // 'foreign' | 'china'
            const [chinaProvince, setChinaProvince] = useState('');
            const [isSingleAffidavit, setIsSingleAffidavit] = useState(false); // 私文書特例：單身宣誓書
            const [isDivorcedSingle, setIsDivorcedSingle] = useState(false); // 離婚單身
            const [isWidowedSingle, setIsWidowedSingle] = useState(false); // 喪偶單身

            // 認證業務：常見認證文書種類（複選）
            const [selectedDocs, setSelectedDocs] = useState([]);
            const toggleDoc = (docName) => {
                setSelectedDocs(prev => 
                    prev.includes(docName) ? prev.filter(d => d !== docName) : [...prev, docName]
                );
            };

            // 認證業務：攜帶護照 與 證明文件 勾選
            const [attestBringPassport, setAttestBringPassport] = useState(false);
            const [attestBringProofDocs, setAttestBringProofDocs] = useState(false);

            // 3. 【公證費用】相關狀態
            const [hasExecutionClause, setHasExecutionClause] = useState(true); // 強制執行條款勾選 (預設 true)
            // 租約費用參數
            const [houseValue, setHouseValue] = useState('');
            const [monthlyRent, setMonthlyRent] = useState('');
            const [rentTerm, setRentTerm] = useState('');
            const [deposit, setDeposit] = useState('');
            const [notaryPages, setNotaryPages] = useState('2');
            const [attachPages, setAttachPages] = useState('4');
            const [leaseCopies, setLeaseCopies] = useState('2');
            // 借貸費用參數
            const [loanPrincipal, setLoanPrincipal] = useState('');
            const [loanInterest, setLoanInterest] = useState('');
            const [loanPenalty, setLoanPenalty] = useState('');
            const [loanTotalCustom, setLoanTotalCustom] = useState('');
            const [loanTotalIsManual, setLoanTotalIsManual] = useState(false);

            useEffect(() => {
                if (!loanTotalIsManual) {
                    const p = parseInt(loanPrincipal) || 0;
                    const i = parseInt(loanInterest) || 0;
                    const pen = parseInt(loanPenalty) || 0;
                    const sum = p + i + pen;
                    setLoanTotalCustom(sum > 0 ? String(sum) : '');
                }
            }, [loanPrincipal, loanInterest, loanPenalty, loanTotalIsManual]);

            // 離婚費用參數
            const [divorcePropertyAmount, setDivorcePropertyAmount] = useState('');

            // 認證費用新架構：
            // 第一部分：500, 700, 750, 自訂 (預設 750)
            const [attestFeeMode, setAttestFeeMode] = useState('750'); // '500','700','750','custom'
            const [attestFeeCustom, setAttestFeeCustom] = useState('');
            // 第二部分：額外費用 (複選)
            const [attestTravelDay, setAttestTravelDay] = useState(false); // 外出日費500元
            const [attestHalfDaySundry, setAttestHalfDaySundry] = useState(false); // 半日雜費200元
            const [attestTaxiFee, setAttestTaxiFee] = useState(false); // 永和區往返查證現場之計程車費
            // 第三部分：影印費
            const [attestColorCopyFee, setAttestColorCopyFee] = useState(false); // 彩色影印費1頁10元

            // 4. 【預約資訊】相關狀態 (8碼快速解析)
            const [bookingCode, setBookingCode] = useState('');
            const parsedBookingTime = useMemo(() => {
                if (!/^\d{8}$/.test(bookingCode)) return '';
                const m = parseInt(bookingCode.substring(0, 2), 10);
                const d = parseInt(bookingCode.substring(2, 4), 10);
                const h = parseInt(bookingCode.substring(4, 6), 10);
                const min = bookingCode.substring(6, 8);
                const yr = new Date().getFullYear();
                const dateObj = new Date(yr, m - 1, d);
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                return `${yr}年${m}月${d}日星期${weekdays[dateObj.getDay()]} ${h}時${min}分`;
            }, [bookingCode]);

            // 5. 【注意事項】標題核取方塊狀態 (預設)
            // 租賃
            const [noticeLeaseTax, setNoticeLeaseTax] = useState(true);
            const [noticeLeaseCondition, setNoticeLeaseCondition] = useState(true);
            // 借貸
            const [noticeLoanProof, setNoticeLoanProof] = useState(true);
            const [noticeLoanTax, setNoticeLoanTax] = useState(true);
            const [noticeLoanExec, setNoticeLoanExec] = useState(true);
            // 離婚
            const [noticeDivorceWitness, setNoticeDivorceWitness] = useState(true);
            const [noticeDivorceReg, setNoticeDivorceReg] = useState(true);
            // 認證（大陸地區專用，預設 true）
            const [noticeAttestProv, setNoticeAttestProv] = useState(true);
            const [noticeAttestSef, setNoticeAttestSef] = useState(true);
            const [noticeAttestTime, setNoticeAttestTime] = useState(true);
            // 認證（外國專用，預設 true）
            const [noticeAttestForeignStep, setNoticeAttestForeignStep] = useState(true);
            // 認證新增通用項目（預設 false，由公證人視情況勾選）
            const [noticeAttestNoInstant, setNoticeAttestNoInstant] = useState(false); // 無法當下取件
            const [noticeAttestInstant, setNoticeAttestInstant] = useState(false); // 當下取件
            const [noticeAttestAmend, setNoticeAttestAmend] = useState(false); // 補正
            const [noticeAttestSignOnSite, setNoticeAttestSignOnSite] = useState(false); // 當場簽章
            const [noticeAttestHousehold, setNoticeAttestHousehold] = useState(false); // 戶籍謄本
            const [noticeAttestColorCopy, setNoticeAttestColorCopy] = useState(false); // 彩色影印
            const [noticeAttestCopyStamp, setNoticeAttestCopyStamp] = useState(false); // 認證繕影本
            const [noticeAttestLangChoice, setNoticeAttestLangChoice] = useState(false); // 認證語言
            const [noticeAttestPassportPage, setNoticeAttestPassportPage] = useState(false); // 護照
            const [noticeAttestSingleNature, setNoticeAttestSingleNature] = useState(true); // 單身宣誓書性質

            // 各欄「加入總結果」勾選狀態
            const [includeCol1, setIncludeCol1] = useState(true);
            const [includeCol2, setIncludeCol2] = useState(true);
            const [includeCol3, setIncludeCol3] = useState(true);
            const [includeCol4, setIncludeCol4] = useState(true);
            const [includeCol5, setIncludeCol5] = useState(true);

            // 各欄輸出文字狀態
            const [col1Text, setCol1Text] = useState('');
            const [col2Text, setCol2Text] = useState('');
            const [col3Text, setCol3Text] = useState('');
            const [col4Text, setCol4Text] = useState('');
            const [col5Text, setCol5Text] = useState('');
            const [totalSummaryText, setTotalSummaryText] = useState('');

            // 手動編輯旗標
            const [col1Edited, setCol1Edited] = useState(false);
            const [col2Edited, setCol2Edited] = useState(false);
            const [col3Edited, setCol3Edited] = useState(false);
            const [col4Edited, setCol4Edited] = useState(false);
            const [col5Edited, setCol5Edited] = useState(false);
            const [totalEdited, setTotalEdited] = useState(false);

            // 輔助函式：租約公司/個人文件字串
            const getLeaseLandlordDocs = (type) => {
                if (type === 'p_self') return "身分證正本、建物權狀正本(若出租人非單獨所有權人請先告知)、最近一期房屋稅單正本(或向稅捐處申請稅籍證明)";
                if (type === 'p_agent') return "本人身分證影本、授權書正本(加蓋與印鑑證明相同印鑑章)、戶政事務所印鑑證明正本(用途註明公證)、代理人身分證正本、建物權狀正本(若出租人非單獨所有權人請先告知)、最近一期房屋稅單正本(或向稅捐處申請稅籍證明)";
                if (type === 'c_self') return "公司最新設立(變更)登記事項表正本、公司大小章、負責人身分證正本、建物權狀正本(若出租人非單獨所有權人請先告知)、最近一期房屋稅單正本(或向稅捐處申請稅籍證明)";
                return "最新公司設立(變更)登記事項表影本(加蓋登記表公司大小章)、授權書正本(蓋登記表公司大小章)、公司負責人身分證影本、公司大小章(備用)、代理人身分證正本、建物權狀正本(若出租人非單獨所有權人請先告知)、最近一期房屋稅單正本(或向稅捐處申請稅籍證明)";
            };

            const getLeaseTenantDocs = (type) => {
                if (type === 'p_self') return "身分證正本";
                if (type === 'p_agent') return "本人身分證影本、授權書正本(加蓋與印鑑證明相同印鑑章)、戶政事務所印鑑證明正本(用途註明公證)、代理人身分證正本";
                if (type === 'c_self') return "公司最新設立(變更)登記事項表正本、公司大小章、負責人身分證正本";
                return "最新公司設立(變更)登記事項表影本(加蓋登記表公司大小章)、授權書正本(蓋登記表公司大小章)、公司負責人身分證影本、公司大小章(備用)、代理人身分證正本";
            };

            const getLoanPartyDocs = (type) => {
                if (type === 'p_self') return "身分證正本、印章。";
                if (type === 'p_agent') return "本人身分證影本、戶政印鑑證明正本(用途註明公證)、授權書正本(加蓋印鑑章)、代理人身分證正本、印章。";
                if (type === 'c_self') return "公司最新設立(變更)登記事項表正本、公司大小章、負責人身分證正本、印章。";
                return "最新公司設立(變更)登記事項表影本(加蓋大小章)、授權書正本(蓋登記表公司大小章)、公司負責人身分證影本、公司大小章(備用)、代理人身分證正本、印章。";
            };

            // ---------------- 計算各欄預設自動產出文字 ----------------
            // 欄位 1：應到場人
            const autoCol1 = useMemo(() => {
                if (mainCategory === 'notary') {
                    if (subCategory === 'lease') {
                        let lStr = '出租人(房東)本人';
                        if (landlordType === 'p_agent') lStr = '出租人(房東)代理人';
                        else if (landlordType === 'c_self') lStr = '出租人(房東)負責人';
                        else if (landlordType === 'c_agent') lStr = '出租人(房東)公司代理人';

                        let tStr = '承租人(房客)本人';
                        if (tenantType === 'p_agent') tStr = '承租人(房客)代理人';
                        else if (tenantType === 'c_self') tStr = '承租人(房客)負責人';
                        else if (tenantType === 'c_agent') tStr = '承租人(房客)公司代理人';

                        const gStr = leaseGuarantor === 'has' ? '\n連帶保證人本人' : '';
                        return `【應到場人】\n${lStr}\n${tStr}${gStr}`;
                    } else if (subCategory === 'loan') {
                        let lStr = '貸與人(出借方)本人';
                        if (lenderType === 'p_agent') lStr = '貸與人(出借方)代理人';
                        else if (lenderType === 'c_self') lStr = '貸與人(出借方)負責人';
                        else if (lenderType === 'c_agent') lStr = '貸與人(出借方)公司代理人';

                        let bStr = '借用人(借款方)本人';
                        if (borrowerType === 'p_agent') bStr = '借用人(借款方)代理人';
                        else if (borrowerType === 'c_self') bStr = '借用人(借款方)負責人';
                        else if (borrowerType === 'c_agent') bStr = '借用人(借款方)公司代理人';

                        const gStr = loanGuarantor === 'has' ? '\n連帶保證人本人' : '';
                        return `【應到場人】\n${lStr}\n${bStr}${gStr}`;
                    } else if (subCategory === 'divorce') {
                        return `【應到場人】\n離婚雙方\n證人兩位`;
                    }
                } else {
                    // 認證業務
                    if (subCategory === 'trans') {
                        return `【應到場人】\n翻譯者(必須懂中文及英文)`;
                    }
                    if (subCategory === 'private' && isSingleAffidavit) {
                        return `【應到場人】\n宣誓人本人親自到場(單身宣誓書依法不得代理)`;
                    }
                    // 私文書、公文書、繕影本
                    if (attestRequesterType === 'p_self') return `【應到場人】\n本人`;
                    if (attestRequesterType === 'p_rel') return `【應到場人】\n本人的親屬(父母子女配偶親兄弟姊妹)`;
                    if (attestRequesterType === 'p_agent') return `【應到場人】\n代理人`;
                    if (attestRequesterType === 'c_self') return `【應到場人】\n公司負責人`;
                    if (attestRequesterType === 'c_agent') return `【應到場人】\n公司代理人`;
                }
                return '【應到場人】\n當事人本人';
            }, [mainCategory, subCategory, landlordType, tenantType, leaseGuarantor, lenderType, borrowerType, loanGuarantor, attestRequesterType, isSingleAffidavit]);

            // 欄位 2：應備文件
            const autoCol2 = useMemo(() => {
                if (mainCategory === 'notary') {
                    if (subCategory === 'lease') {
                        const lDocs = getLeaseLandlordDocs(landlordType);
                        const tDocs = getLeaseTenantDocs(tenantType);
                        let itemIdx = 1;
                        let res = "【應備文件】\n";
                        res += `${itemIdx++}.房東：${lDocs}\n`;
                        res += `${itemIdx++}.房客：${tDocs}`;
                        if (leaseGuarantor === 'has') {
                            res += `\n${itemIdx++}.連帶保證人：身分證正本。`;
                        }
                        if (leaseContractType === 'self') {
                            res += `\n${itemIdx++}.自備租約(請先傳給公證人審閱)`;
                        } else {
                            res += `\n${itemIdx++}.租約(若無特約條款可由公證人現場登打列印；若有特約條款，建議電腦填寫回傳檔案，公證人審閱後當場列印，不必自行列印)。`;
                        }
                        return res;
                    } else if (subCategory === 'loan') {
                        const lDocs = getLoanPartyDocs(lenderType);
                        const bDocs = getLoanPartyDocs(borrowerType);
                        let itemIdx = 1;
                        let res = "【應備文件】\n";
                        res += `${itemIdx++}.貸與人：${lDocs}\n`;
                        res += `${itemIdx++}.借用人：${bDocs}\n`;
                        if (loanGuarantor === 'has') {
                            res += `${itemIdx++}.連帶保證人：身分證正本、印章。\n`;
                        }
                        res += `${itemIdx++}.雙方收付款項帳戶存摺正本(或封面影本，網銀可使用匯出存摺封面功能)。\n`;
                        if (!loanIsPaid) {
                            res += `${itemIdx++}.資金交付證明：當場手機轉帳截圖，或公證後前往銀行匯款再返回本所提供匯款單。`;
                        } else {
                            res += `${itemIdx++}.資金交付證明：銀行匯款單，或現場操作手機網銀截圖先前轉帳紀錄。`;
                        }
                        return res;
                    } else if (subCategory === 'divorce') {
                        const childPart = divorceHasChild ? "及子女" : "";
