<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公證綜合工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 隱藏橫向滾動條但保持可滾動 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo, useEffect } = React;

        const CalendarIcon = ({className="w-5 h-5"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>;
        const ArchiveIcon = ({className="w-5 h-5"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>;
        const FileTextIcon = ({className="w-5 h-5"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>;
        const CalculatorIcon = ({className="w-5 h-5"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>;
        const CopyIcon = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>;
        const CheckCircleIcon = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

        const copyToClipboard = (text, onSuccess) => {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
            } else {
                fallbackCopy(text, onSuccess);
            }
        };

        const fallbackCopy = (text, onSuccess) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                if (document.execCommand('copy')) onSuccess();
            } catch (err) {}
            document.body.removeChild(textArea);
        };

        const CopyButton = ({ onClick, copied }) => (
            <button onClick={onClick} className={`flex items-center space-x-1 px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${copied ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}`}>
                {copied ? <CheckCircleIcon /> : <CopyIcon />}
                <span>{copied ? '已複製' : '一鍵複製'}</span>
            </button>
        );

        const Card = ({ title, id, icon, children }) => (
            <section id={id} className="scroll-mt-28 md:scroll-mt-12">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-100 px-6 py-4 border-b border-slate-200 flex items-center space-x-3">
                        <div className="text-blue-600 bg-blue-100 p-2 rounded-lg shadow-sm">{icon}</div>
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 tracking-wide">{title}</h2>
                    </div>
                    {children}
                </div>
            </section>
        );

        function BookingPanel() {
            const [bookingDateInput, setBookingDateInput] = useState('');
            const [isEdited, setIsEdited] = useState(false);
            const [customText, setCustomText] = useState('');
            const [copied, setCopied] = useState(false);

            const parsedDateStr = useMemo(() => {
                if (!/^\d{8}$/.test(bookingDateInput)) return null;
                const month = parseInt(bookingDateInput.substring(0, 2), 10);
                const day = parseInt(bookingDateInput.substring(2, 4), 10);
                const hour = parseInt(bookingDateInput.substring(4, 6), 10);
                const minute = bookingDateInput.substring(6, 8);
                const currentYear = new Date().getFullYear();
                const d = new Date(currentYear, month - 1, day);
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                return `${currentYear}年${month}月${day}日星期${weekdays[d.getDay()]} ${hour}時${minute}分`;
            }, [bookingDateInput]);

            const draftText = parsedDateStr 
                ? `【預約確認】\n（＊到七樓按電鈴＊）為您保留 ${parsedDateStr} 的時間，本事務所在 新北市永和區永和路二段57號7樓 （豪泰大樓 威肯商務中心）電話 0277296396 若要取消請提早告知，謝謝。`
                : '';

            useEffect(() => { if (!isEdited) setCustomText(draftText); }, [draftText, isEdited]);

            return (
                <Card title="1. 預約資訊" id="part1" icon={<CalendarIcon />}>
                    <div className="flex flex-col lg:flex-row gap-6 p-6">
                        <div className="w-full lg:w-1/3 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">輸入日期時間 (純數字 8 碼)</label>
                                <input 
                                    type="text" maxLength={8} value={bookingDateInput} 
                                    onChange={(e) => setBookingDateInput(e.target.value.replace(/\D/g, ''))} 
                                    placeholder="例: 05041430" 
                                    className="w-full rounded-lg border border-slate-300 px-4 py-2 focus:border-blue-500 focus:ring-1 outline-none font-mono"
                                />
                            </div>
                            <div className="text-sm text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                解析結果：<span className="font-medium text-slate-800">{parsedDateStr || '等待輸入...'}</span>
                            </div>
                        </div>
                        <div className="w-full lg:w-2/3 flex flex-col">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-medium text-slate-700">產出訊息 {isEdited && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded ml-2">已手動修改</span>}</span>
                                <div className="space-x-2 flex items-center">
                                    {isEdited && <button onClick={() => { setIsEdited(false); setCustomText(draftText); }} className="text-xs text-slate-500 hover:text-slate-800 underline">捨棄修改</button>}
                                    <CopyButton copied={copied} onClick={() => { copyToClipboard(customText, () => setCopied(true)); setTimeout(() => setCopied(false), 2000); }} />
                                </div>
                            </div>
                            <textarea 
                                value={customText}
                                onChange={(e) => { setIsEdited(true); setCustomText(e.target.value); }}
                                className="w-full h-32 p-4 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-1 outline-none resize-none font-mono text-sm leading-relaxed"
                                placeholder="預約確認訊息將自動產生於此..."
                            />
                        </div>
                    </div>
                </Card>
            );
        }

        const getToday = () => {
            const d = new Date();
            return `${d.getFullYear() - 1911}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        };
        const parseYear = (t) => t ? (parseInt(t) || 0) : 0;
        const fmtDate = (t) => {
            if (!t) return '';
            if (t.includes('年')) return t;
            const p = t.split(/[\/\.\-\s]+/);
            return p.length === 3 ? `${p[0]}年${p[1]}月${p[2]}日` : t;
        };

        const CategoryRadio = ({ value, current, onChange, title, lines }) => (
            <label className={`flex items-start p-3 border rounded-lg cursor-pointer transition-all select-none ${current === value ? 'bg-blue-50 border-blue-500 ring-1 ring-blue-500' : 'hover:bg-slate-50 border-slate-200'}`}>
                <div className="flex h-5 items-center mt-0.5">
                    <input type="radio" value={value} checked={current === value} onChange={(e) => onChange(e.target.value)} className="h-4 w-4" />
                </div>
                <div className="ml-3 text-sm flex-1">
                    <span className={`font-medium block ${current === value ? 'text-blue-900' : 'text-slate-900'}`}>{title}</span>
                    {lines && lines.length > 0 && (
                        <div className={`mt-1.5 space-y-1 ${current === value ? 'text-blue-700' : 'text-slate-500'}`}>
                            {lines.map((line, i) => <div key={i} className="text-xs border-l-2 border-slate-400/50 pl-2">{line}</div>)}
                        </div>
                    )}
                </div>
            </label>
        );

        function RetentionPanel() {
            const [rDate, setRDate] = useState(getToday());
            const [cDate, setCDate] = useState(getToday());
            const [aDate, setADate] = useState(getToday());
            const [cat, setCat] = useState('1');
            const [isCont, setIsCont] = useState(false);
            const [expDate, setExpDate] = useState('');
            const [copied, setCopied] = useState(false);

            const result = useMemo(() => {
                let status = 'success', rStr = '', startYear = 0, dStr = '';
                if ((cat === '2' || cat === '3') && isCont && !expDate) status = 'missing';
                
                const aYr = parseYear(aDate);
                const eYr = parseYear(expDate);

                if (cat === '1') {
                    rStr = '永久'; startYear = aYr + 1; dStr = '無';
                } else if (cat === '4') {
                    rStr = '5年'; startYear = aYr + 1; dStr = `${startYear + 5}年01月01日`;
                } else {
                    const yrs = cat === '2' ? 15 : 10;
                    rStr = `${yrs}年`;
                    startYear = isCont ? eYr + 1 : aYr + 1;
                    dStr = `${startYear + yrs}年01月01日`;
                }
                return { status, startYearStr: `${startYear}年`, rStr, dStr };
            }, [aDate, cat, isCont, expDate]);

            return (
                <Card title="2. 公證保存年限計算機" id="part2" icon={<ArchiveIcon />}>
                    <div className="flex flex-col lg:flex-row p-6 gap-8">
                        {/* 左側設定區 */}
                        <div className="w-full lg:w-1/2 space-y-6">
                            <div className="space-y-3">
                                <h3 className="text-sm font-bold text-slate-500 flex items-center"><FileTextIcon className="w-4 h-4 mr-1"/>日期設定 (民國)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div><label className="block text-xs text-slate-500 mb-1">收案日期</label><input type="text" value={rDate} onChange={e=>setRDate(e.target.value)} className="w-full rounded border px-3 py-2 text-sm outline-none focus:border-blue-500"/></div>
                                    <div><label className="block text-xs text-slate-500 mb-1">結案日期</label><input type="text" value={cDate} onChange={e=>setCDate(e.target.value)} className="w-full rounded border px-3 py-2 text-sm outline-none focus:border-blue-500"/></div>
                                    <div className="bg-yellow-50 p-1.5 -m-1.5 rounded-lg border border-yellow-200">
                                        <label className="block text-xs font-bold text-slate-700 mb-1 ml-1.5">歸檔日期</label>
                                        <input type="text" value={aDate} onChange={e=>setADate(e.target.value)} className="w-full rounded border px-3 py-2 text-sm outline-none focus:border-blue-500"/>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-3">
                                <h3 className="text-sm font-bold text-slate-500">第一層：案件種類</h3>
                                <CategoryRadio value="1" current={cat} onChange={setCat} title="(一) 永久類（包括公證及認證）" lines={['案由物權：不動產物權得喪變更','案由親屬：婚姻、認領、收養等','案由繼承：遺囑或遺產處分行為']} />
                                <CategoryRadio value="2" current={cat} onChange={setCat} title="(二) 其他公證類" lines={['案由債權：買賣、租賃、借貸、委任等','案由其他']} />
                                <CategoryRadio value="3" current={cat} onChange={setCat} title="(三) 其他認證類" lines={['單身、債權、公/私文書、繕影本、翻譯本等']} />
                                <CategoryRadio value="4" current={cat} onChange={setCat} title="(四) 未作成類（包括公證及認證）" />
                            </div>

                            {(cat === '2' || cat === '3') && (
                                <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 animate-[fadeIn_0.3s_ease-out]">
                                    <h3 className="text-sm font-medium text-slate-700 mb-2">第二層：是否為繼續性法律行為？</h3>
                                    <div className="flex gap-4 mb-3">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" checked={!isCont} onChange={()=>setIsCont(false)} className="w-4 h-4 text-blue-600"/><span>非繼續性 (預設)</span></label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" checked={isCont} onChange={()=>setIsCont(true)} className="w-4 h-4 text-blue-600"/><span className="font-semibold text-blue-700">繼續性</span></label>
                                    </div>
                                    {isCont && (
                                        <div className="pt-3 border-t border-blue-200">
                                            <label className="block text-sm font-medium text-slate-700 mb-1">期限屆至日期 <span className="text-red-500">*</span></label>
                                            <input type="text" value={expDate} onChange={e=>setExpDate(e.target.value)} placeholder="例：118/12/31" className="w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-500"/>
                                            <p className="text-xs text-blue-600 mt-1">繼續性法律行為以此日為起算基準</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* 右側結果區 */}
                        <div className="w-full lg:w-1/2">
                            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 h-full flex flex-col">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-4 mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">運算結果</h3>
                                    <CopyButton copied={copied} onClick={() => {
                                        if(result.status === 'missing') return alert('請填寫完整資訊');
                                        const txt = `收案日期 ${fmtDate(rDate)}\n結案日期 ${fmtDate(cDate)}\n歸檔日期 ${fmtDate(aDate)}\n保存年限起算 ${result.startYearStr}\n保存年限 ${result.rStr}\n預定銷燬日期 ${result.dStr}`;
                                        copyToClipboard(txt, () => setCopied(true));
                                        setTimeout(() => setCopied(false), 2000);
                                    }} />
                                </div>
                                
                                {result.status === 'missing' ? (
                                    <div className="flex-1 flex items-center justify-center text-amber-600 text-sm font-medium">請輸入期限屆至日期以進行計算。</div>
                                ) : (
                                    <div className="font-mono text-sm leading-relaxed space-y-4">
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">收案日期</span><span className="text-black">{fmtDate(rDate)}</span></div>
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">結案日期</span><span className="text-black">{fmtDate(cDate)}</span></div>
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500 font-bold">歸檔日期</span><span className="text-black">{fmtDate(aDate)}</span></div>
                                        {isCont && cat!=='1' && cat!=='4' && <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">期限屆至</span><span className="text-black">{fmtDate(expDate)}</span></div>}
                                        <div className="my-3 border-t border-slate-200 border-dashed"></div>
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">保存年限起算</span><span className="text-black font-medium">{result.startYearStr}</span></div>
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">保存年限</span><span className="text-black font-medium">{result.rStr}</span></div>
                                        <div className="grid grid-cols-[100px_1fr] gap-2"><span className="text-slate-500">預定銷燬日期</span><span className="text-black font-medium">{result.dStr}</span></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </Card>
            );
        }

        function FormatPanel() {
            const [batchInput, setBatchInput] = useState('');
            
            const parsedRecords = useMemo(() => {
                const lines = batchInput.split('\n');
                const records = [];
                let currentRecord = null;
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const match = line.match(/^([^\s　]+)[\s　]+(.+)$/);
                    if (match) {
                        const key = match[1], value = match[2].trim();
                        if (key.includes('姓名')) {
                            if (currentRecord) records.push(currentRecord);
                            currentRecord = { name: value };
                        } else if (currentRecord) {
                            if (key.includes('性別')) currentRecord.gender = value;
                            else if (key.includes('字號') || key.includes('證明') || key.includes('編號')) currentRecord.id = value;
                            else if (key.includes('日期')) currentRecord.dob = value;
                            else if (key.includes('地址')) currentRecord.address = value;
                        }
                    }
                });
                if (currentRecord) records.push(currentRecord);
                return records;
            }, [batchInput]);

            const formatRecord = (data) => {
                const { name = '', gender = '', id = '', dob = '', address = '' } = data;
                if (name.includes('公司')) {
                    return [name, id, address ? '登記地址' + address : ''].filter(Boolean).join('\n');
                } else {
                    const l2 = [gender, id, dob].filter(Boolean).join(' ');
                    let l3 = address;
                    if (l3 && l3.length > 1) l3 = l3.charAt(0) + ' ' + l3.slice(1);
                    return [name, l2, l3].filter(Boolean).join('\n');
                }
            };

            const Block = ({ index, text }) => {
                const [copied, setCopied] = useState(false);
                return (
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-sm font-bold text-slate-700">第 {index + 1} 組公證書</span>
                            <CopyButton copied={copied} onClick={() => { copyToClipboard(text, () => setCopied(true)); setTimeout(() => setCopied(false), 2000); }} />
                        </div>
                        <textarea readOnly value={text} className="w-full h-24 bg-white p-3 rounded-md border border-slate-200 text-sm font-mono resize-none outline-none text-slate-800" />
                    </div>
                )
            };

            return (
                <Card title="3. 公證書排版工具" id="part3" icon={<FileTextIcon />}>
                    <div className="flex flex-col lg:flex-row gap-6 p-6">
                        <div className="w-full lg:w-1/2">
                            <label className="block text-sm font-medium text-slate-700 mb-2">貼上請求書資料 (自動依「姓名」分組)</label>
                            <textarea 
                                value={batchInput} onChange={e => setBatchInput(e.target.value)}
                                className="w-full h-[450px] p-4 rounded-lg border border-slate-300 font-mono text-sm focus:border-blue-500 focus:ring-1 outline-none resize-none leading-relaxed"
                                placeholder="請將所有請求書資料一次性貼上..."
                            />
                        </div>
                        <div className="w-full lg:w-1/2 flex flex-col">
                            <label className="block text-sm font-medium text-slate-700 mb-2">排版輸出區</label>
                            <div className="flex-1 overflow-y-auto space-y-4 max-h-[450px] pr-2">
                                {parsedRecords.length === 0 ? (
                                    <div className="text-slate-400 text-sm italic flex items-center justify-center h-32 border-2 border-dashed border-slate-200 rounded-lg">等待貼上資料，結果將顯示於此...</div>
                                ) : (
                                    parsedRecords.map((rec, i) => <Block key={i} index={i} text={formatRecord(rec)} />)
                                )}
                            </div>
                        </div>
                    </div>
                </Card>
            );
        }

        function FeePanel() {
            const [houseValue, setHouseValue] = useState('');
            const [rentType, setRentType] = useState('auto');
            const [monthly, setMonthly] = useState('');
            const [term, setTerm] = useState('');
            const [total, setTotal] = useState('');
            const [deposit, setDeposit] = useState('');
            const [isEdited, setIsEdited] = useState(false);
            const [customText, setCustomText] = useState('');
            const [copied, setCopied] = useState(false);

            // 超張費狀態
            const [extraPages, setExtraPages] = useState('');
            const [extraCopies, setExtraCopies] = useState('');
            const [extraIsEdited, setExtraIsEdited] = useState(false);
            const [extraCustomText, setExtraCustomText] = useState('');
            const [extraCopied, setExtraCopied] = useState(false);

            const calcResult = useMemo(() => {
                const vH = parseInt(houseValue) || 0;
                let vR = 0, vD = 0;
                if (rentType === 'auto') {
                    vR = (parseInt(monthly) || 0) * (parseInt(term) || 0);
                    vD = (parseInt(monthly) || 0) * 2;
                } else {
                    vR = parseInt(total) || 0;
                    vD = parseInt(deposit) || 0;
                }
                const target = Math.max(vH, vR) + vD;

                if (vH === 0 && vR === 0 && vD === 0) return null;

                let fee = 0, err = false;
                if (target <= 200000) fee = 1500;
                else if (target <= 500000) fee = 3000;
                else if (target <= 1000000) fee = 4500;
                else if (target <= 2000000) fee = 6000;
                else if (target <= 5000000) fee = 7500;
                else if (target <= 10000000) fee = 9000;
                else if (target <= 20000000) fee = 12000;
                else err = true;

                const suffix = (!houseValue || vH === 0) ? "（僅預估尚應確認房屋現值）" : "";
                const text = err ? "價額超過20,000,000元無法計算，請查閱標準表。" : `【公證費用】\n本件房屋現值${vH}元，與租金總額${vR}元比較，較高者加上押金${vD}元，本件價額${target}元，按公證費用標準表收基本費用${fee}元${suffix}。`;
                return { vR, vD, text, err };
            }, [houseValue, rentType, monthly, term, total, deposit]);

            useEffect(() => { if (!isEdited) setCustomText(calcResult ? calcResult.text : ''); }, [calcResult, isEdited]);

            // 超張費計算邏輯
            const extraCalcResult = useMemo(() => {
                const p = parseInt(extraPages);
                const c = parseInt(extraCopies);
                if (isNaN(p) || isNaN(c)) return null;

                const excess = Math.max(0, p - 4);
                const fee = excess * 50 * c;
                
                return {
                    text: `公證書 2 頁，後附文書(契約) ${p} 頁，標準張數 6 頁，超過 ${excess} 頁*50元*正本 ${c} 份=超張費 ${fee} 元。`
                };
            }, [extraPages, extraCopies]);

            useEffect(() => { 
                if (!extraIsEdited) {
                    setExtraCustomText(extraCalcResult ? extraCalcResult.text : ''); 
                }
            }, [extraCalcResult, extraIsEdited]);

            return (
                <Card title="4. 租約公證費用與超張費試算" id="part4" icon={<CalculatorIcon />}>
                    <div className="flex flex-col lg:flex-row gap-6 p-6">
                        <div className="w-full lg:w-1/2 space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">1. 房屋現值 (稅單金額)</label>
                                <input type="number" value={houseValue} onChange={e=>setHouseValue(e.target.value)} placeholder="輸入房屋現值" className="w-full sm:w-1/2 rounded-lg border px-3 py-2 text-sm focus:border-blue-500 outline-none"/>
                            </div>
                            
                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <div className="flex space-x-6 mb-4">
                                    <label className="flex items-center space-x-2 cursor-pointer text-sm">
                                        <input type="radio" checked={rentType === 'auto'} onChange={()=>setRentType('auto')} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/>
                                        <span className="font-medium text-slate-700">輸入月租自動計算</span>
                                    </label>
                                    <label className="flex items-center space-x-2 cursor-pointer text-sm">
                                        <input type="radio" checked={rentType === 'direct'} onChange={()=>setRentType('direct')} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/>
                                        <span className="font-medium text-slate-700">直接輸入總額</span>
                                    </label>
                                </div>
                                {rentType === 'auto' ? (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-xs text-slate-500 mb-1">月租金</label><input type="number" value={monthly} onChange={e=>setMonthly(e.target.value)} className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/></div>
                                        <div><label className="block text-xs text-slate-500 mb-1">租約期數 (個月)</label><input type="number" value={term} onChange={e=>setTerm(e.target.value)} className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/></div>
                                        <div className="col-span-2 bg-white px-3 py-2 rounded border border-slate-200 flex justify-between text-sm">
                                            <span className="text-slate-600">試算租金總額：<span className="font-bold text-blue-700">{calcResult?.vR || 0}</span></span>
                                            <span className="text-slate-600">押金(預設2個月)：<span className="font-bold text-blue-700">{calcResult?.vD || 0}</span></span>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-xs text-slate-500 mb-1">2. 租金總額</label><input type="number" value={total} onChange={e=>setTotal(e.target.value)} className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/></div>
                                        <div><label className="block text-xs text-slate-500 mb-1">3. 押金</label><input type="number" value={deposit} onChange={e=>setDeposit(e.target.value)} className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/></div>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="w-full lg:w-1/2 flex flex-col">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-medium text-slate-700">產出訊息 {isEdited && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded ml-2">已手動修改</span>}</span>
                                <div className="space-x-2 flex items-center">
                                    {isEdited && <button onClick={() => { setIsEdited(false); setCustomText(calcResult ? calcResult.text : ''); }} className="text-xs text-slate-500 hover:text-slate-800 underline">捨棄修改</button>}
                                    <CopyButton copied={copied} onClick={() => { copyToClipboard(customText, () => setCopied(true)); setTimeout(() => setCopied(false), 2000); }} />
                                </div>
                            </div>
                            <textarea 
                                value={customText}
                                onChange={(e) => { setIsEdited(true); setCustomText(e.target.value); }}
                                className={`w-full h-32 lg:h-full p-4 rounded-lg border outline-none resize-none font-mono text-sm leading-relaxed ${calcResult?.err ? 'border-red-300 text-red-600' : 'border-slate-300 focus:border-blue-500 text-slate-800'}`}
                                placeholder="公證費用試算結果將自動產生於此..."
                            />
                        </div>
                    </div>
                    
                    <div className="border-t border-slate-100 mx-6"></div>

                    <div className="flex flex-col lg:flex-row gap-6 p-6">
                        <div className="w-full lg:w-1/2 space-y-4">
                            <h3 className="text-sm font-bold text-slate-700 mb-1">超張費試算</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">後附文書(契約) 頁數</label>
                                    <input type="number" value={extraPages} onChange={e=>setExtraPages(e.target.value)} placeholder="例：10" className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">正本 份數</label>
                                    <input type="number" value={extraCopies} onChange={e=>setExtraCopies(e.target.value)} placeholder="例：2" className="w-full rounded border px-3 py-2 text-sm focus:border-blue-500 outline-none"/>
                                </div>
                            </div>
                        </div>
                        <div className="w-full lg:w-1/2 flex flex-col">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-medium text-slate-700">超張費產出訊息 {extraIsEdited && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded ml-2">已手動修改</span>}</span>
                                <div className="space-x-2 flex items-center">
                                    {extraIsEdited && <button onClick={() => { setExtraIsEdited(false); setExtraCustomText(extraCalcResult ? extraCalcResult.text : ''); }} className="text-xs text-slate-500 hover:text-slate-800 underline">捨棄修改</button>}
                                    <CopyButton copied={extraCopied} onClick={() => { copyToClipboard(extraCustomText, () => setExtraCopied(true)); setTimeout(() => setExtraCopied(false), 2000); }} />
                                </div>
                            </div>
                            <textarea 
                                value={extraCustomText}
                                onChange={(e) => { setExtraIsEdited(true); setExtraCustomText(e.target.value); }}
                                className="w-full h-32 lg:h-full p-4 rounded-lg border border-slate-300 focus:border-blue-500 text-slate-800 outline-none resize-none font-mono text-sm leading-relaxed"
                                placeholder="超張費試算結果將自動產生於此..."
                            />
                        </div>
                    </div>
                </Card>
            );
        }

        function App() {
            const [activeId, setActiveId] = useState('part1');

            const navItems = [
                { id: 'part1', name: '預約資訊', icon: <CalendarIcon /> },
                { id: 'part2', name: '保存年限計算', icon: <ArchiveIcon /> },
                { id: 'part3', name: '公證書排版', icon: <FileTextIcon /> },
                { id: 'part4', name: '公證與超張費試算', icon: <CalculatorIcon /> },
            ];

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) setActiveId(entry.target.id);
                    });
                }, { rootMargin: '-20% 0px -60% 0px' });
                navItems.forEach(item => {
                    const el = document.getElementById(item.id);
                    if (el) observer.observe(el);
                });
                return () => observer.disconnect();
            }, []);

            const scrollTo = (id) => document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* 手機版頂部導覽 */}
                    <header className="md:hidden sticky top-0 z-50 bg-slate-900 shadow-md">
                        <div className="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                            <h1 className="text-lg font-bold text-white tracking-widest">公證綜合工具箱</h1>
                        </div>
                        <div className="flex overflow-x-auto hide-scrollbar">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => scrollTo(item.id)} className={`flex-shrink-0 flex items-center space-x-1 px-4 py-3 border-b-2 text-sm font-medium transition-colors ${activeId === item.id ? 'border-blue-500 text-blue-400 bg-slate-800' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                    {item.icon}<span>{item.name}</span>
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* 電腦版側邊導覽 */}
                    <aside className="w-64 bg-slate-900 text-white flex-col h-screen fixed hidden md:flex">
                        <div className="p-6 border-b border-slate-800">
                            <h1 className="text-xl font-bold tracking-widest text-white mb-1">公證綜合工具箱</h1>
                            <p className="text-xs text-slate-400">民間公證人專用整合版</p>
                        </div>
                        <nav className="flex-1 py-6 space-y-2 px-4">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => scrollTo(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-all ${activeId === item.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                                    {item.icon}
                                    <span className="font-medium tracking-wide">{item.name}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* 主內容區 */}
                    <main className="flex-1 p-4 md:p-8 md:ml-64 bg-slate-50">
                        <div className="max-w-5xl mx-auto space-y-10 md:space-y-16 pb-32">
                            <BookingPanel />
                            <RetentionPanel />
                            <FormatPanel />
                            <FeePanel />
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
