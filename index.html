                                            重設
                                        </button>
                                    )}
                                    <CopyBtn text={col4Text} label="複製" />
                                </div>
                            </div>
                            <div className="p-2 flex-1 flex flex-col">
                                <textarea
                                    value={col4Text}
                                    onChange={e => { setCol4Edited(true); setCol4Text(e.target.value); }}
                                    className="w-full h-full p-2.5 text-xs font-mono leading-relaxed rounded border border-slate-200 focus:border-blue-500 outline-none bg-slate-50/50"
                                />
                            </div>
                            <div className="px-3 py-2 bg-slate-50 border-t flex items-center justify-between text-xs">
                                <label className="inline-flex items-center space-x-1.5 cursor-pointer text-slate-700">
                                    <input
                                        type="checkbox"
                                        checked={includeCol4}
                                        onChange={e=>setIncludeCol4(e.target.checked)}
                                        className="rounded text-blue-600"
                                    />
                                    <span className="font-medium text-[11px]">加入總結果</span>
                                </label>
                                <span className="text-[10px] text-slate-400">{col4Edited ? '● 已修改' : '自動'}</span>
                            </div>
                        </div>

                        {/* 欄 5: 注意事項 */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[390px]">
                            <div className="bg-slate-50 px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                                <span className="font-bold text-xs text-slate-700 flex items-center">
                                    <span className="w-2 h-2 rounded-full bg-rose-500 mr-1.5"></span>
                                    5. 注意事項
                                </span>
                                <div className="flex items-center space-x-1">
                                    {col5Edited && (
                                        <button onClick={()=>{setCol5Edited(false); setCol5Text(autoCol5);}} className="text-[10px] text-slate-400 hover:text-slate-700 underline">
                                            重設
                                        </button>
                                    )}
                                    <CopyBtn text={col5Text} label="複製" />
                                </div>
                            </div>
                            <div className="p-2 flex-1 flex flex-col">
                                <textarea
                                    value={col5Text}
                                    onChange={e => { setCol5Edited(true); setCol5Text(e.target.value); }}
                                    className="w-full h-full p-2.5 text-xs font-mono leading-relaxed rounded border border-slate-200 focus:border-blue-500 outline-none bg-slate-50/50"
                                />
                            </div>
                            <div className="px-3 py-2 bg-slate-50 border-t flex items-center justify-between text-xs">
                                <label className="inline-flex items-center space-x-1.5 cursor-pointer text-slate-700">
                                    <input
                                        type="checkbox"
                                        checked={includeCol5}
                                        onChange={e=>setIncludeCol5(e.target.checked)}
                                        className="rounded text-blue-600"
                                    />
                                    <span className="font-medium text-[11px]">加入總結果</span>
                                </label>
                                <span className="text-[10px] text-slate-400">{col5Edited ? '● 已修改' : '自動'}</span>
                            </div>
                        </div>
                    </div>

                    {/* 總結果區 (一鍵組裝與手動微調) */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-800 text-white px-6 py-3.5 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <span className="bg-blue-500 text-white text-xs px-2 py-0.5 rounded font-bold">總結果</span>
                                <h3 className="font-bold text-sm tracking-wide">全套回覆訊息整合區 (供 LINE / Email 完整送出)</h3>
                                {totalEdited && <span className="text-[11px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-400/30">已手動客製編輯</span>}
                            </div>
                            <div className="flex items-center space-x-3">
                                {totalEdited && (
                                    <button
                                        onClick={() => { setTotalEdited(false); setTotalSummaryText(autoTotalSummary); }}
                                        className="text-xs text-slate-300 hover:text-white underline"
                                    >
                                        捨棄手動修改重新彙整
                                    </button>
                                )}
                                <CopyBtn text={totalSummaryText} label="📋 複製全套回覆訊息" />
                            </div>
                        </div>
                        <div className="p-4 bg-slate-900/5">
                            <textarea
                                value={totalSummaryText}
                                onChange={e => { setTotalEdited(true); setTotalSummaryText(e.target.value); }}
                                className="w-full h-64 p-4 text-xs font-mono leading-relaxed rounded-xl border border-slate-300 focus:border-blue-500 outline-none bg-white shadow-inner"
                                placeholder="勾選加入總結果的欄位將依序空行彙整至此，您可以直接在此進行最後文字微調後複製..."
                            />
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------ 後台：行政與排版工具 ------------------
        const getToday = () => {
            const d = new Date();
            return `${d.getFullYear() - 1911}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        };
        const parseYear = (t) => t ? (parseInt(t) || 0) : 0;
        const fmtDate = (t) => {
            if (!t) return '';
            if (t.includes('年')) return t;
            const p = t.split(/[\/\.\-\s]+/);
            return p.length === 3 ? `${p[0]}年${p[1]}月${p[2]}日` : t;
        };

        const CategoryRadio = ({ value, current, onChange, title, lines }) => (
            <label className={`flex items-start p-3 border rounded-lg cursor-pointer transition-all select-none ${current === value ? 'bg-blue-50 border-blue-500 ring-1 ring-blue-500' : 'hover:bg-slate-50 border-slate-200'}`}>
                <div className="flex h-5 items-center mt-0.5">
                    <input type="radio" value={value} checked={current === value} onChange={(e) => onChange(e.target.value)} className="h-4 w-4 text-blue-600" />
                </div>
                <div className="ml-3 text-sm flex-1">
                    <span className={`font-medium block ${current === value ? 'text-blue-900' : 'text-slate-900'}`}>{title}</span>
                    {lines && lines.length > 0 && (
                        <div className={`mt-1.5 space-y-1 ${current === value ? 'text-blue-700' : 'text-slate-500'}`}>
                            {lines.map((line, i) => <div key={i} className="text-xs border-l-2 border-slate-400/50 pl-2">{line}</div>)}
                        </div>
                    )}
                </div>
            </label>
        );

        function BackendAdminTool() {
            const [rDate, setRDate] = useState(getToday());
            const [cDate, setCDate] = useState(getToday());
            const [aDate, setADate] = useState(getToday());
            const [cat, setCat] = useState('1');
            const [isCont, setIsCont] = useState(false);
            const [expDate, setExpDate] = useState('');

            const result = useMemo(() => {
                let status = 'success', rStr = '', startYear = 0, dStr = '';
                if ((cat === '2' || cat === '3') && isCont && !expDate) status = 'missing';
                
                const aYr = parseYear(aDate);
                const eYr = parseYear(expDate);

                if (cat === '1') {
                    rStr = '永久'; startYear = aYr + 1; dStr = '無';
                } else if (cat === '4') {
                    rStr = '5年'; startYear = aYr + 1; dStr = `${startYear + 5}年01月01日`;
                } else {
                    const yrs = cat === '2' ? 15 : 10;
                    rStr = `${yrs}年`;
                    startYear = isCont ? eYr + 1 : aYr + 1;
                    dStr = `${startYear + yrs}年01月01日`;
                }
                return { status, startYearStr: `${startYear}年`, rStr, dStr };
            }, [aDate, cat, isCont, expDate]);

            // 排版工具狀態
            const [batchInput, setBatchInput] = useState('');
            const parsedRecords = useMemo(() => {
                const lines = batchInput.split('\n');
                const records = [];
                let currentRecord = null;
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const match = line.match(/^([^\s　]+)[\s　]+(.+)$/);
                    if (match) {
                        const key = match[1], value = match[2].trim();
                        if (key.includes('姓名')) {
                            if (currentRecord) records.push(currentRecord);
                            currentRecord = { name: value };
                        } else if (currentRecord) {
                            if (key.includes('性別')) currentRecord.gender = value;
                            else if (key.includes('字號') || key.includes('證明') || key.includes('編號')) currentRecord.id = value;
                            else if (key.includes('日期')) currentRecord.dob = value;
                            else if (key.includes('地址')) currentRecord.address = value;
                        }
                    }
                });
                if (currentRecord) records.push(currentRecord);
                return records;
            }, [batchInput]);

            const formatRecord = (data) => {
                const { name = '', gender = '', id = '', dob = '', address = '' } = data;
                if (name.includes('公司')) {
                    return [name, id, address ? '登記地址' + address : ''].filter(Boolean).join('\n');
                } else {
                    const l2 = [gender, id, dob].filter(Boolean).join(' ');
                    let l3 = address;
                    if (l3 && l3.length > 1) l3 = l3.charAt(0) + ' ' + l3.slice(1);
                    return [name, l2, l3].filter(Boolean).join('\n');
                }
            };

            return (
                <div className="space-y-8">
                    {/* 1. 保存年限計算機 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                            <h2 className="text-base font-bold text-slate-800 flex items-center">
                                <span className="p-1.5 bg-blue-100 text-blue-700 rounded-lg mr-2.5">🗄️</span>
                                1. 公證卷宗保存年限計算機
                            </h2>
                        </div>
                        <div className="flex flex-col lg:flex-row p-6 gap-8">
                            <div className="w-full lg:w-1/2 space-y-5">
                                <div>
                                    <h4 className="text-xs font-bold text-slate-500 mb-2">收結與歸檔日期 (民國年)</h4>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">收案日期</label>
                                            <input type="text" value={rDate} onChange={e=>setRDate(e.target.value)} className="w-full text-xs font-mono p-2 border rounded"/>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">結案日期</label>
                                            <input type="text" value={cDate} onChange={e=>setCDate(e.target.value)} className="w-full text-xs font-mono p-2 border rounded"/>
                                        </div>
                                        <div className="bg-amber-50/70 p-1 -m-1 rounded border border-amber-200">
                                            <label className="block text-[11px] font-bold text-amber-800 mb-1 ml-1">歸檔日期</label>
                                            <input type="text" value={aDate} onChange={e=>setADate(e.target.value)} className="w-full text-xs font-mono p-2 border rounded bg-white"/>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-slate-500">案件保存類別</h4>
                                    <CategoryRadio value="1" current={cat} onChange={setCat} title="(一) 永久類（含公證及認證）" lines={['物權、婚姻/親屬、遺囑繼承']} />
                                    <CategoryRadio value="2" current={cat} onChange={setCat} title="(二) 其他公證類 (15年)" lines={['債權租賃、借貸、委任等']} />
                                    <CategoryRadio value="3" current={cat} onChange={setCat} title="(三) 其他認證類 (10年)" lines={['單身宣誓、文書認證、翻譯影本等']} />
                                    <CategoryRadio value="4" current={cat} onChange={setCat} title="(四) 未作成類 (5年)" />
                                </div>

                                {(cat === '2' || cat === '3') && (
                                    <div className="bg-blue-50 p-3.5 rounded-lg border border-blue-100 text-xs">
                                        <div className="font-semibold text-slate-700 mb-2">是否為繼續性法律行為？</div>
                                        <div className="flex gap-4 mb-2">
                                            <label className="flex items-center gap-1.5 cursor-pointer">
                                                <input type="radio" checked={!isCont} onChange={()=>setIsCont(false)} />
                                                <span>非繼續性 (以歸檔年起算)</span>
                                            </label>
                                            <label className="flex items-center gap-1.5 cursor-pointer font-bold text-blue-700">
                                                <input type="radio" checked={isCont} onChange={()=>setIsCont(true)} />
                                                <span>繼續性 (以屆至日為準)</span>
                                            </label>
                                        </div>
                                        {isCont && (
                                            <div className="pt-2 border-t border-blue-200">
                                                <label className="block text-[11px] font-bold text-slate-700 mb-1">期限屆至日期 *</label>
                                                <input type="text" value={expDate} onChange={e=>setExpDate(e.target.value)} placeholder="例：118/12/31" className="w-full p-2 border rounded bg-white font-mono text-xs"/>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="w-full lg:w-1/2">
                                <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 h-full flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-center border-b pb-3 mb-4">
                                            <span className="font-bold text-sm text-slate-700">運算結果清單</span>
                                            <CopyBtn
                                                text={`收案日期 ${fmtDate(rDate)}
結案日期 ${fmtDate(cDate)}
歸檔日期 ${fmtDate(aDate)}
保存年限起算 ${result.startYearStr}
保存年限 ${result.rStr}
預定銷燬日期 ${result.dStr}`}
                                                label="複製結果"
                                            />
                                        </div>
                                        {result.status === 'missing' ? (
                                            <div className="text-amber-600 text-xs py-8 text-center">請輸入期限屆至日期以進行完整運算。</div>
                                        ) : (
                                            <div className="font-mono text-xs leading-loose space-y-2">
                                                <div className="flex justify-between border-b border-dashed pb-1"><span className="text-slate-400">收案日期</span><span>{fmtDate(rDate)}</span></div>
                                                <div className="flex justify-between border-b border-dashed pb-1"><span className="text-slate-400">結案日期</span><span>{fmtDate(cDate)}</span></div>
                                                <div className="flex justify-between border-b border-dashed pb-1 font-bold"><span className="text-slate-500">歸檔日期</span><span>{fmtDate(aDate)}</span></div>
                                                {isCont && cat!=='1' && cat!=='4' && <div className="flex justify-between border-b border-dashed pb-1 text-blue-700"><span className="text-slate-400">期限屆至</span><span>{fmtDate(expDate)}</span></div>}
                                                <div className="flex justify-between border-b border-dashed pb-1"><span className="text-slate-400">起算年度</span><span className="font-bold">{result.startYearStr}</span></div>
                                                <div className="flex justify-between border-b border-dashed pb-1"><span className="text-slate-400">法定保存年限</span><span className="font-bold text-blue-600">{result.rStr}</span></div>
                                                <div className="flex justify-between pt-1 text-slate-900 font-bold"><span className="text-slate-400">預定銷燬日期</span><span>{result.dStr}</span></div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="text-[11px] text-slate-400 mt-4 border-t pt-2">依公證卷宗保存及銷毀規則規範自動推算</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 2. 公證書排版工具 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                            <h2 className="text-base font-bold text-slate-800 flex items-center">
                                <span className="p-1.5 bg-indigo-100 text-indigo-700 rounded-lg mr-2.5">📝</span>
                                2. 公證書請求人排版工具
                            </h2>
                        </div>
                        <div className="flex flex-col lg:flex-row gap-6 p-6">
                            <div className="w-full lg:w-1/2">
                                <label className="block text-xs font-bold text-slate-500 mb-2">貼上請求書資料 (自動依「姓名」智慧分組)：</label>
                                <textarea
                                    value={batchInput}
                                    onChange={e => setBatchInput(e.target.value)}
                                    placeholder="在此貼上請求書內容，系統將自動解析姓名、性別、身分證字號、出生日期、地址..."
                                    className="w-full h-80 p-3 rounded-lg border border-slate-300 font-mono text-xs outline-none focus:border-blue-500 bg-slate-50/50 leading-relaxed"
                                />
                            </div>
                            <div className="w-full lg:w-1/2 flex flex-col">
                                <label className="block text-xs font-bold text-slate-500 mb-2">排版輸出區：</label>
                                <div className="flex-1 overflow-y-auto space-y-3 max-h-80 pr-1">
                                    {parsedRecords.length === 0 ? (
                                        <div className="text-slate-400 text-xs italic flex items-center justify-center h-48 border-2 border-dashed border-slate-200 rounded-lg">
                                            等待貼上資料，解析結果將顯示於此...
                                        </div>
                                    ) : (
                                        parsedRecords.map((rec, i) => {
                                            const formatted = formatRecord(rec);
                                            return (
                                                <div key={i} className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs">
                                                    <div className="flex justify-between items-center mb-1.5">
                                                        <span className="font-bold text-slate-700">第 {i+1} 位請求人 / 公司</span>
                                                        <CopyBtn text={formatted} label="複製組別" />
                                                    </div>
                                                    <textarea readOnly value={formatted} className="w-full h-20 bg-white p-2 border rounded font-mono text-xs outline-none resize-none" />
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------ 主程式進入點 (分頁切換) ------------------
        function App() {
            const [activeTab, setActiveTab] = useState('front'); // 'front' (預設) | 'back'

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow">
                                    公
                                </div>
                                <div>
                                    <h1 className="font-bold text-base tracking-wide">公證業務整合系統</h1>
                                    <p className="text-[10px] text-slate-400">民間公證人回覆與行政專用</p>
                                </div>
                            </div>

                            <div className="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                                <button
                                    onClick={() => setActiveTab('front')}
                                    className={`flex items-center space-x-1.5 px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                        activeTab === 'front'
                                            ? 'bg-blue-600 text-white shadow-md'
                                            : 'text-slate-300 hover:text-white'
                                    }`}
                                >
                                    <span>💬 前台：回覆溝通工具</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('back')}
                                    className={`flex items-center space-x-1.5 px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                        activeTab === 'back'
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'text-slate-300 hover:text-white'
                                    }`}
                                >
                                    <span>⚙️ 後台：行政與排版工具</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
                        {activeTab === 'front' ? <FrontendReplyTool /> : <BackendAdminTool />}
                    </main>

                    <footer className="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
                        公證業務輔助系統 · 專用單頁工具
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
