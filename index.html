                setNoticeAttestNoInstant(false); setNoticeAttestInstant(false); setNoticeAttestAmend(false);
                setNoticeAttestSignOnSite(false); setNoticeAttestHousehold(false); setNoticeAttestColorCopy(false);
                setNoticeAttestCopyStamp(false); setNoticeAttestLangChoice(false); setNoticeAttestPassportPage(false);
                setNoticeAttestSingleNature(true);

                setSelectedDocs([]);
                setAttestBringPassport(false); setAttestBringProofDocs(false);
                setLoanTotalIsManual(false);
            };

            return (
                <div className="space-y-6">
                    {/* ================= 頂部分類與統一結構化輸入區 ================= */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-900 text-white p-4 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                                    <button
                                        onClick={() => handleMainChange('notary')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                            mainCategory === 'notary' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        ⚖️ 公證業務
                                    </button>
                                    <button
                                        onClick={() => handleMainChange('attest')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                            mainCategory === 'attest' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'
                                        }`}
                                    >
                                        📄 認證業務
                                    </button>
                                </div>

                                <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                                    {mainCategory === 'notary' ? (
                                        <>
                                            {[
                                                { id: 'lease', label: '🏠 租賃' },
                                                { id: 'loan', label: '💰 借貸' },
                                                { id: 'divorce', label: '💍 離婚' },
                                            ].map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => setSubCategory(item.id)}
                                                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                                                        subCategory === item.id ? 'bg-white text-blue-900 shadow' : 'text-slate-300 hover:text-white'
                                                    }`}
                                                >
                                                    {item.label}
                                                </button>
                                            ))}
                                        </>
                                    ) : (
                                        <>
                                            {[
                                                { id: 'private', label: '私文書' },
                                                { id: 'public', label: '公文書' },
                                                { id: 'copy', label: '繕影本' },
                                                { id: 'trans', label: '翻譯本' },
                                            ].map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => { setSubCategory(item.id); setSelectedDocs([]); }}
                                                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-all ${
                                                        subCategory === item.id ? 'bg-white text-indigo-900 shadow' : 'text-slate-300 hover:text-white'
                                                    }`}
                                                >
                                                    {item.label}
                                                </button>
                                            ))}
                                        </>
                                    )}
                                </div>
                            </div>

                            <button
                                onClick={handleResetAll}
                                className="text-xs text-slate-300 hover:text-white underline flex items-center space-x-1"
                            >
                                <span>🔄 恢復各欄自動生成預設</span>
                            </button>
                        </div>

                        {/* 統一輸入表單區：依序對齊 1.應到場人、2.應備文件、3.公證費用、4.預約資訊、5.注意事項 */}
                        <div className="p-5 space-y-4 text-xs">
                            {/* --- 區塊 1: 應到場人 --- */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <div className="flex items-center space-x-2 mb-2.5">
                                    <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                                    <span className="font-bold text-slate-800">1. 應到場人設定</span>
                                </div>
                                <div className="flex flex-wrap items-center gap-3">
                                    {mainCategory === 'notary' && subCategory === 'lease' && (
                                        <>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">房東身份：</span>
                                                <select value={landlordType} onChange={e=>setLandlordType(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500">
                                                    <option value="p_self">個人親到</option>
                                                    <option value="p_agent">個人代理</option>
                                                    <option value="c_self">公司親到</option>
                                                    <option value="c_agent">公司代理</option>
                                                </select>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">房客身份：</span>
                                                <select value={tenantType} onChange={e=>setTenantType(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500">
                                                    <option value="p_self">個人親到</option>
                                                    <option value="p_agent">個人代理</option>
                                                    <option value="c_self">公司親到</option>
                                                    <option value="c_agent">公司代理</option>
                                                </select>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">連帶保證人：</span>
                                                <select value={leaseGuarantor} onChange={e=>setLeaseGuarantor(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500 font-semibold text-blue-700">
                                                    <option value="none">無</option>
                                                    <option value="has">有</option>
                                                </select>
                                            </div>
                                        </>
                                    )}

                                    {mainCategory === 'notary' && subCategory === 'loan' && (
                                        <>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">出借方身份：</span>
                                                <select value={lenderType} onChange={e=>setLenderType(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500">
                                                    <option value="p_self">個人親到</option>
                                                    <option value="p_agent">個人代理</option>
                                                    <option value="c_self">公司親到</option>
                                                    <option value="c_agent">公司代理</option>
                                                </select>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">借款方身份：</span>
                                                <select value={borrowerType} onChange={e=>setBorrowerType(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500">
                                                    <option value="p_self">個人親到</option>
                                                    <option value="p_agent">個人代理</option>
                                                    <option value="c_self">公司親到</option>
                                                    <option value="c_agent">公司代理</option>
                                                </select>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-500 font-medium">連帶保證人：</span>
                                                <select value={loanGuarantor} onChange={e=>setLoanGuarantor(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-blue-500 font-semibold text-blue-700">
                                                    <option value="none">無</option>
                                                    <option value="has">有</option>
                                                </select>
                                            </div>
                                        </>
                                    )}

                                    {mainCategory === 'notary' && subCategory === 'divorce' && (
                                        <div className="text-slate-600 bg-white px-3 py-1.5 rounded-lg border border-slate-200">
                                            離婚雙方及證人兩位親自到場 (依法不得代理)
                                        </div>
                                    )}

                                    {mainCategory === 'attest' && (
                                        <>
                                            {subCategory === 'trans' ? (
                                                <div className="text-indigo-700 bg-white px-3 py-1.5 rounded-lg border border-indigo-200 font-semibold">
                                                    翻譯本僅接受「個人親到」(翻譯者必須懂中文及英文)
                                                </div>
                                            ) : isSingleAffidavit ? (
                                                <div className="text-indigo-700 bg-white px-3 py-1.5 rounded-lg border border-indigo-200 font-semibold">
                                                    單身宣誓書依法限宣誓人本人親到 (不得代理)
                                                </div>
                                            ) : (
                                                <div className="flex items-center space-x-2">
                                                    <span className="text-slate-500 font-medium">請求人到場身份：</span>
                                                    <select value={attestRequesterType} onChange={e=>setAttestRequesterType(e.target.value)} className="p-1.5 border rounded-lg bg-white shadow-sm outline-none focus:border-indigo-500 font-semibold text-indigo-700">
                                                        <option value="p_self">個人親到</option>
                                                        <option value="p_rel">個人親屬</option>
                                                        <option value="p_agent">個人代理</option>
                                                        <option value="c_self">公司親到</option>
                                                        <option value="c_agent">公司代理</option>
                                                    </select>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>

                            {/* --- 區塊 2: 應備文件 --- */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                                <div className="flex items-center space-x-2 mb-1">
                                    <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                                    <span className="font-bold text-slate-800">2. 應備文件設定</span>
                                </div>

                                {mainCategory === 'notary' && subCategory === 'lease' && (
                                    <div className="flex items-center space-x-3 bg-white px-3 py-1.5 rounded-lg border border-slate-200">
                                        <span className="text-slate-600 font-medium">租約契約提供方式：</span>
                                        <label className="inline-flex items-center space-x-1 cursor-pointer">
                                            <input type="radio" checked={leaseContractType === 'template'} onChange={()=>setLeaseContractType('template')} className="text-blue-600"/>
                                            <span className={leaseContractType === 'template' ? 'font-bold text-blue-700' : 'text-slate-600'}>範本 (由公證人列印)</span>
                                        </label>
                                        <label className="inline-flex items-center space-x-1 cursor-pointer">
                                            <input type="radio" checked={leaseContractType === 'self'} onChange={()=>setLeaseContractType('self')} className="text-blue-600"/>
                                            <span className={leaseContractType === 'self' ? 'font-bold text-blue-700' : 'text-slate-600'}>自備 (先傳審閱)</span>
                                        </label>
                                    </div>
                                )}

                                {mainCategory === 'notary' && subCategory === 'loan' && (
                                    <div className="flex items-center space-x-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200">
                                        <span className="text-slate-600 font-medium">借貸金流現況：</span>
                                        <button
                                            onClick={() => setLoanIsPaid(false)}
                                            className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${!loanIsPaid ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            事前 (當場交款)
                                        </button>
                                        <button
                                            onClick={() => setLoanIsPaid(true)}
                                            className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${loanIsPaid ? 'bg-emerald-600 text-white shadow' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            事後 (具銀行金流)
                                        </button>
                                    </div>
                                )}

                                {mainCategory === 'notary' && subCategory === 'divorce' && (
                                    <div className="flex items-center space-x-3 bg-white px-3 py-1.5 rounded-lg border border-slate-200">
                                        <span className="text-slate-600 font-medium">未成年子女：</span>
                                        <label className="inline-flex items-center space-x-1 cursor-pointer">
                                            <input type="radio" checked={divorceHasChild} onChange={()=>setDivorceHasChild(true)} className="text-blue-600"/>
                                            <span className={divorceHasChild ? 'font-bold text-blue-700' : 'text-slate-600'}>有 (戶籍謄本含子女)</span>
                                        </label>
                                        <label className="inline-flex items-center space-x-1 cursor-pointer">
                                            <input type="radio" checked={!divorceHasChild} onChange={()=>setDivorceHasChild(false)} className="text-blue-600"/>
                                            <span className={!divorceHasChild ? 'font-bold text-blue-700' : 'text-slate-600'}>無</span>
                                        </label>
                                    </div>
                                )}

                                {mainCategory === 'attest' && (
                                    <div className="space-y-2.5">
                                        {/* 地區與特例 */}
                                        <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <div className="flex items-center space-x-2">
                                                <span className="text-slate-600 font-medium">使用地區：</span>
                                                <select value={attestRegion} onChange={e=>setAttestRegion(e.target.value)} className="p-1 border rounded bg-white text-xs font-semibold text-indigo-700">
                                                    <option value="china">大陸</option>
                                                    <option value="foreign">外國</option>
                                                </select>
                                                {attestRegion === 'china' && (
                                                    <input
                                                        type="text"
                                                        value={chinaProvince}
                                                        onChange={e=>setChinaProvince(e.target.value)}
                                                        placeholder="請輸入省份 (例：廣東省)"
                                                        className="w-36 p-1 border rounded bg-slate-50 text-xs"
                                                    />
                                                )}
                                            </div>

                                            {subCategory === 'private' && (
                                                <div className="flex items-center space-x-3 pl-3 border-l border-slate-200">
                                                    <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                        <input type="checkbox" checked={isSingleAffidavit} onChange={e=>setIsSingleAffidavit(e.target.checked)} className="rounded text-indigo-600" />
                                                        <span className="font-bold text-indigo-700">單身宣誓書 (現場以範本製作)</span>
                                                    </label>
                                                    {isSingleAffidavit && (
                                                        <div className="flex items-center space-x-2 text-slate-600">
                                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                                <input type="checkbox" checked={isDivorcedSingle} onChange={e=>setIsDivorcedSingle(e.target.checked)} className="rounded text-indigo-600" />
                                                                <span>離婚附協議書/判決</span>
                                                            </label>
                                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                                <input type="checkbox" checked={isWidowedSingle} onChange={e=>setIsWidowedSingle(e.target.checked)} className="rounded text-indigo-600" />
                                                                <span>喪偶附除戶謄本</span>
                                                            </label>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        {/* 常見認證文書種類 (複選，非翻譯本時顯示) */}
                                        {subCategory !== 'trans' && (
                                            <div className="bg-white p-2.5 rounded-lg border border-slate-200">
                                                <div className="text-slate-500 font-medium mb-1.5 flex items-center justify-between">
                                                    <span>常見認證文書種類勾選 (可複選，每選一項單獨列出一行，未勾選則顯示待認證文書)：</span>
                                                    {selectedDocs.length > 0 && (
                                                        <button onClick={()=>setSelectedDocs([])} className="text-slate-400 hover:text-slate-700 underline text-[11px]">
                                                            清除全部勾選
                                                        </button>
                                                    )}
                                                </div>
                                                <div className="flex flex-wrap gap-2 pt-0.5">
                                                    {subCategory === 'private' && [
                                                        '授權書(委託書/委任書)',
                                                        '公司服務證明(在職/離職)',
                                                        '私立醫院出生證明',
                                                        '私立學校畢業證書/成績單'
                                                    ].map(doc => (
                                                        <button
                                                            key={doc}
                                                            type="button"
                                                            onClick={() => toggleDoc(doc)}
                                                            className={`px-2.5 py-1 rounded-md text-xs border transition-all ${
                                                                selectedDocs.includes(doc)
                                                                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm font-semibold'
                                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                            }`}
                                                        >
                                                            {selectedDocs.includes(doc) ? '✓ ' : '+ '}{doc}
                                                        </button>
                                                    ))}

                                                    {subCategory === 'public' && [
                                                        '戶政事務所文件',
                                                        '良民證',
                                                        '公司設立/變更登記事項表',
                                                        '公立醫院出生證明',
                                                        '公立學校畢業證書/成績單'
                                                    ].map(doc => (
                                                        <button
                                                            key={doc}
                                                            type="button"
                                                            onClick={() => toggleDoc(doc)}
                                                            className={`px-2.5 py-1 rounded-md text-xs border transition-all ${
                                                                selectedDocs.includes(doc)
                                                                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm font-semibold'
                                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                            }`}
                                                        >
                                                            {selectedDocs.includes(doc) ? '✓ ' : '+ '}{doc}
                                                        </button>
                                                    ))}

                                                    {subCategory === 'copy' && [
                                                        '台灣護照',
                                                        '台灣駕照',
                                                        '台灣身分證'
                                                    ].map(doc => (
                                                        <button
                                                            key={doc}
                                                            type="button"
                                                            onClick={() => toggleDoc(doc)}
                                                            className={`px-2.5 py-1 rounded-md text-xs border transition-all ${
                                                                selectedDocs.includes(doc)
                                                                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-sm font-semibold'
                                                                    : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                            }`}
                                                        >
                                                            {selectedDocs.includes(doc) ? '✓ ' : '+ '}{doc}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* 攜帶護照與證明文件 (四種認證皆提供) */}
                                        <div className="flex flex-wrap items-center gap-4 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <span className="text-slate-600 font-medium">附加文件項目：</span>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={attestBringPassport}
                                                    onChange={e=>setAttestBringPassport(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="font-semibold text-slate-700">攜帶護照</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={attestBringProofDocs}
                                                    onChange={e=>setAttestBringProofDocs(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="font-semibold text-slate-700">證明文件</span>
                                            </label>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* --- 區塊 3: 公證費用 --- */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                        <span className="font-bold text-slate-800">3. 公證費用計算參數</span>
                                    </div>
                                    {mainCategory === 'notary' && (
                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer bg-white px-2.5 py-1 rounded-lg border border-emerald-300 shadow-sm">
                                            <input
                                                type="checkbox"
                                                checked={hasExecutionClause}
                                                onChange={e=>setHasExecutionClause(e.target.checked)}
                                                className="rounded text-blue-600"
                                            />
                                            <span className="font-bold text-emerald-900">有強制執行條款</span>
                                        </label>
                                    )}
                                </div>

                                {mainCategory === 'notary' && subCategory === 'lease' && (
                                    <div className="space-y-2.5">
                                        <div className="flex flex-wrap items-center gap-2 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <span className="font-bold text-blue-900 mr-1">基本費：</span>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">房屋現值</span>
                                                <input type="number" value={houseValue} onChange={e=>setHouseValue(e.target.value)} placeholder="選填" className="w-24 px-2 py-1 rounded border bg-slate-50 text-center placeholder:text-center font-mono"/>
                                                <span>元</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">月租</span>
                                                <input type="number" value={monthlyRent} onChange={e=>setMonthlyRent(e.target.value)} placeholder="選填" className="w-20 px-2 py-1 rounded border bg-slate-50 text-center placeholder:text-center font-mono"/>
                                                <span>元</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">租期</span>
                                                <input type="number" value={rentTerm} onChange={e=>setRentTerm(e.target.value)} placeholder="選填" className="w-16 px-2 py-1 rounded border bg-slate-50 text-center placeholder:text-center font-mono"/>
                                                <span>個月</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">押金</span>
                                                <input type="number" value={deposit} onChange={e=>setDeposit(e.target.value)} placeholder="選填" className="w-20 px-2 py-1 rounded border bg-slate-50 text-center placeholder:text-center font-mono"/>
                                                <span>元</span>
                                            </div>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <span className="font-bold text-slate-700 mr-1">超張費：</span>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">公證書頁數</span>
                                                <input type="number" value={notaryPages} onChange={e=>setNotaryPages(e.target.value)} className="w-14 px-2 py-1 rounded border bg-slate-50 text-right font-mono"/>
                                                <span>頁</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">+ 附件頁數</span>
                                                <input type="number" value={attachPages} onChange={e=>setAttachPages(e.target.value)} className="w-14 px-2 py-1 rounded border bg-slate-50 text-right font-mono"/>
                                                <span>頁</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="text-slate-600">× 正本份數</span>
                                                <input type="number" value={leaseCopies} onChange={e=>setLeaseCopies(e.target.value)} className="w-12 px-2 py-1 rounded border bg-slate-50 text-right font-mono"/>
                                                <span>份</span>
                                            </div>
                                            <span className="text-[11px] text-slate-400">
                                                (合計 6 頁以內不計超張費，7 頁以上自動試算)
                                            </span>
                                        </div>
                                    </div>
                                )}

                                {mainCategory === 'notary' && subCategory === 'loan' && (
                                    <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                        <div className="flex items-center space-x-1">
                                            <span className="text-slate-600">本金</span>
                                            <input
                                                type="number"
                                                value={loanPrincipal}
                                                onChange={e => { setLoanTotalIsManual(false); setLoanPrincipal(e.target.value); }}
                                                placeholder="請輸入本金"
                                                className="w-24 px-2 py-1 rounded border bg-slate-50 text-right font-mono"
                                            />
                                            <span>元</span>
                                        </div>
                                        <div className="flex items-center space-x-1">
                                            <span className="text-slate-600">利息</span>
                                            <input
                                                type="number"
                                                value={loanInterest}
                                                onChange={e => { setLoanTotalIsManual(false); setLoanInterest(e.target.value); }}
                                                placeholder="無則填0"
                                                className="w-20 px-2 py-1 rounded border bg-slate-50 text-right font-mono"
                                            />
                                            <span>元</span>
                                        </div>
                                        <div className="flex items-center space-x-1">
                                            <span className="text-slate-600">違約金</span>
                                            <input
                                                type="number"
                                                value={loanPenalty}
                                                onChange={e => { setLoanTotalIsManual(false); setLoanPenalty(e.target.value); }}
                                                placeholder="無則填0"
                                                className="w-20 px-2 py-1 rounded border bg-slate-50 text-right font-mono"
                                            />
                                            <span>元</span>
                                        </div>
                                        <div className="flex items-center space-x-1 bg-amber-50 p-1 rounded-lg border border-amber-200">
                                            <span className="font-bold text-amber-900">標的總價額</span>
                                            <input
                                                type="number"
                                                value={loanTotalCustom}
                                                onChange={e => { setLoanTotalIsManual(true); setLoanTotalCustom(e.target.value); }}
                                                placeholder="前三者自動加總或直接填寫"
                                                className="w-36 px-2 py-1 rounded border border-amber-300 bg-white text-right font-mono font-bold text-amber-800"
                                            />
                                            <span className="font-bold text-amber-900">元</span>
                                        </div>
                                        {loanTotalIsManual && (
                                            <button
                                                onClick={() => {
                                                    setLoanTotalIsManual(false);
                                                    const p = parseInt(loanPrincipal) || 0;
                                                    const i = parseInt(loanInterest) || 0;
                                                    const pen = parseInt(loanPenalty) || 0;
                                                    const sum = p + i + pen;
                                                    setLoanTotalCustom(sum > 0 ? String(sum) : '');
                                                }}
                                                className="text-[10px] text-amber-700 underline"
                                            >
                                                恢復自動加總
                                            </button>
                                        )}
                                    </div>
                                )}

                                {mainCategory === 'notary' && subCategory === 'divorce' && (
                                    <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                        <span className="text-slate-600">離婚財產行為公證價額：</span>
                                        <input
                                            type="number"
                                            value={divorcePropertyAmount}
                                            onChange={e=>setDivorcePropertyAmount(e.target.value)}
                                            placeholder="等待填寫 (無財產則留空)"
                                            className="w-48 px-2.5 py-1 rounded border bg-slate-50 text-right font-mono outline-none"
                                        />
                                        <span>元</span>
                                        <span className="text-[11px] text-slate-400">
                                            (預設留空僅計身分行為 1000 元；填寫金額後加計財產行為公證費用)
                                        </span>
                                    </div>
                                )}

                                {mainCategory === 'attest' && (
                                    <div className="space-y-2.5">
                                        {/* 第一部分：認證費用 */}
                                        <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <span className="text-slate-600 font-medium">認證費用：</span>
                                            {['500', '700', '750'].map(val => (
                                                <label key={val} className="inline-flex items-center space-x-1 cursor-pointer">
                                                    <input
                                                        type="radio"
                                                        name="attestFee"
                                                        checked={attestFeeMode === val}
                                                        onChange={() => setAttestFeeMode(val)}
                                                        className="text-indigo-600"
                                                    />
                                                    <span className={attestFeeMode === val ? 'font-bold text-indigo-700' : 'text-slate-600'}>{val} 元</span>
                                                </label>
                                            ))}
                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                <input
                                                    type="radio"
                                                    name="attestFee"
                                                    checked={attestFeeMode === 'custom'}
                                                    onChange={() => setAttestFeeMode('custom')}
                                                    className="text-indigo-600"
                                                />
                                                <span className={attestFeeMode === 'custom' ? 'font-bold text-indigo-700' : 'text-slate-600'}>自訂文字/算式</span>
                                            </label>
                                            {attestFeeMode === 'custom' && (
                                                <input
                                                    type="text"
                                                    value={attestFeeCustom}
                                                    onChange={e=>setAttestFeeCustom(e.target.value)}
                                                    placeholder="例：750+750"
                                                    className="w-36 px-2 py-1 rounded border bg-slate-50 text-xs font-mono"
                                                />
                                            )}
                                        </div>

                                        {/* 額外費用(勾選始列出) */}
                                        <div className="flex flex-wrap items-center gap-3 bg-white p-2.5 rounded-lg border border-slate-200">
                                            <span className="text-slate-600 font-medium">額外費用(勾選始列出)：</span>
                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={attestTravelDay}
                                                    onChange={e=>setAttestTravelDay(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="text-slate-700">外出日費500元</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={attestHalfDaySundry}
                                                    onChange={e=>setAttestHalfDaySundry(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="text-slate-700">外出雜費(半日)200元</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={attestTaxiFee}
                                                    onChange={e=>setAttestTaxiFee(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="text-slate-700">計程車費(永和區往返查證現場)</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1 cursor-pointer pl-2 border-l border-slate-200">
                                                <input
                                                    type="checkbox"
                                                    checked={attestColorCopyFee}
                                                    onChange={e=>setAttestColorCopyFee(e.target.checked)}
                                                    className="rounded text-indigo-600"
                                                />
                                                <span className="text-indigo-900 font-semibold">彩色影印費1頁10元(文件可以自行影印，也可以帶來讓公證人影印)</span>
                                            </label>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* --- 區塊 4: 預約資訊 --- */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <div className="flex items-center space-x-2 mb-2">
                                    <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                                    <span className="font-bold text-slate-800">4. 預約時間設定</span>
                                </div>
                                <div className="flex flex-wrap items-center gap-3">
                                    <div className="flex items-center space-x-1.5">
                                        <span className="text-slate-600">預約時間 (8碼純數字)：</span>
                                        <input
                                            type="text"
                                            maxLength={8}
                                            value={bookingCode}
                                            onChange={e => setBookingCode(e.target.value.replace(/\D/g, ''))}
                                            placeholder="例: 10231023"
                                            className="w-36 text-xs font-mono px-3 py-1.5 border rounded-lg outline-none focus:border-blue-500 bg-white shadow-sm"
                                        />
                                    </div>
                                    <div className="text-xs text-slate-600 bg-white px-3 py-1.5 rounded-lg border border-slate-200 font-mono">
                                        {parsedBookingTime ? `📅 解析：${parsedBookingTime}` : '（未輸入時輸出務必預約與營業資訊，輸入8碼後輸出保留預約確認）'}
                                    </div>
                                </div>
                            </div>

                            {/* --- 區塊 5: 注意事項設定 (勾選項目) --- */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <div className="flex items-center space-x-2 mb-2.5">
                                    <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                                    <span className="font-bold text-slate-800">5. 注意事項項目設定</span>
                                    <span className="text-[11px] text-slate-400">(勾選項目將包含於注意事項輸出並自動依序編號)</span>
                                </div>
                                <div className="bg-white p-2.5 rounded-lg border border-slate-200 space-y-2">
                                    {/* 公證業務注意事項 */}
                                    {mainCategory === 'notary' && subCategory === 'lease' && (
                                        <div className="flex flex-wrap items-center gap-3">
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeLeaseTax} onChange={e=>setNoticeLeaseTax(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">房屋現值確認</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeLeaseCondition} onChange={e=>setNoticeLeaseCondition(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">屋況設備點交</span>
                                            </label>
                                        </div>
                                    )}

                                    {mainCategory === 'notary' && subCategory === 'loan' && (
                                        <div className="flex flex-wrap items-center gap-3">
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeLoanProof} onChange={e=>setNoticeLoanProof(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">金流證明要求</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeLoanTax} onChange={e=>setNoticeLoanTax(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">親屬借貸提醒</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeLoanExec} onChange={e=>setNoticeLoanExec(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">強制執行效力</span>
                                            </label>
                                        </div>
                                    )}

                                    {mainCategory === 'notary' && subCategory === 'divorce' && (
                                        <div className="flex flex-wrap items-center gap-3">
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeDivorceWitness} onChange={e=>setNoticeDivorceWitness(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">見證人身分資格</span>
                                            </label>
                                            <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                <input type="checkbox" checked={noticeDivorceReg} onChange={e=>setNoticeDivorceReg(e.target.checked)} className="rounded text-rose-600" />
                                                <span className="font-medium text-slate-700">登記始生效力</span>
                                            </label>
                                        </div>
                                    )}

                                    {/* 認證業務專屬：基礎流程與4大分組個案叮嚀 */}
                                    {mainCategory === 'attest' && (
                                        <div className="space-y-3">
                                            {/* 驗證流程 */}
                                            <div className="flex flex-wrap items-center gap-3 pb-2 border-b border-slate-100">
                                                <span className="text-slate-500 font-bold">驗證流程：</span>
                                                {attestRegion === 'china' ? (
                                                    <>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestProv} onChange={e=>setNoticeAttestProv(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className="font-medium text-slate-700">省份註記</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestSef} onChange={e=>setNoticeAttestSef(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className="font-medium text-slate-700">海基會轉送流程</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestTime} onChange={e=>setNoticeAttestTime(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className="font-medium text-slate-700">驗證時程</span>
                                                        </label>
                                                    </>
                                                ) : (
                                                    <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                        <input type="checkbox" checked={noticeAttestForeignStep} onChange={e=>setNoticeAttestForeignStep(e.target.checked)} className="rounded text-rose-600" />
                                                        <span className="font-medium text-slate-700">國外文書驗證三步驟</span>
                                                    </label>
                                                )}
                                                {subCategory === 'private' && isSingleAffidavit && (
                                                    <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                        <input type="checkbox" checked={noticeAttestSingleNature} onChange={e=>setNoticeAttestSingleNature(e.target.checked)} className="rounded text-rose-600" />
                                                        <span className="font-medium text-slate-700">單身宣誓書性質</span>
                                                    </label>
                                                )}
                                            </div>

                                            {/* 四大分組個案叮嚀 (所有認證類型均完整呈現) */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
                                                {/* 群組一：個案叮嚀 */}
                                                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
                                                    <div className="text-[11px] font-bold text-slate-700 pb-1 border-b border-slate-200 flex items-center">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>
                                                        個案叮嚀 (一般)
                                                    </div>
                                                    <div className="flex flex-col space-y-1">
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestInstant} onChange={e=>setNoticeAttestInstant(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestInstant ? 'font-bold text-rose-700' : 'text-slate-600'}>當下取件</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestNoInstant} onChange={e=>setNoticeAttestNoInstant(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestNoInstant ? 'font-bold text-rose-700' : 'text-slate-600'}>無法當下取件</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestLangChoice} onChange={e=>setNoticeAttestLangChoice(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestLangChoice ? 'font-bold text-rose-700' : 'text-slate-600'}>認證語言</span>
                                                        </label>
                                                    </div>
                                                </div>

                                                {/* 群組二：個案叮嚀(私文書相關) */}
                                                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
                                                    <div className="text-[11px] font-bold text-slate-700 pb-1 border-b border-slate-200 flex items-center">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-1.5"></span>
                                                        個案叮嚀 (私文書相關)
                                                    </div>
                                                    <div className="flex flex-col space-y-1">
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestAmend} onChange={e=>setNoticeAttestAmend(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestAmend ? 'font-bold text-rose-700' : 'text-slate-600'}>補正</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestSignOnSite} onChange={e=>setNoticeAttestSignOnSite(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestSignOnSite ? 'font-bold text-rose-700' : 'text-slate-600'}>簽章</span>
                                                        </label>
                                                    </div>
                                                </div>

                                                {/* 群組三：個案叮嚀(公文書相關) */}
                                                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
                                                    <div className="text-[11px] font-bold text-slate-700 pb-1 border-b border-slate-200 flex items-center">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1.5"></span>
                                                        個案叮嚀 (公文書相關)
                                                    </div>
                                                    <div className="flex flex-col space-y-1">
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestHousehold} onChange={e=>setNoticeAttestHousehold(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestHousehold ? 'font-bold text-rose-700' : 'text-slate-600'}>戶籍謄本</span>
                                                        </label>
                                                    </div>
                                                </div>

                                                {/* 群組四：個案叮嚀(繕影本相關) */}
                                                <div className="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
                                                    <div className="text-[11px] font-bold text-slate-700 pb-1 border-b border-slate-200 flex items-center">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
                                                        個案叮嚀 (繕影本相關)
                                                    </div>
                                                    <div className="flex flex-col space-y-1">
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestCopyStamp} onChange={e=>setNoticeAttestCopyStamp(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestCopyStamp ? 'font-bold text-rose-700' : 'text-slate-600'}>認證繕影本</span>
                                                        </label>
                                                        <label className="inline-flex items-center space-x-1.5 cursor-pointer">
                                                            <input type="checkbox" checked={noticeAttestPassportPage} onChange={e=>setNoticeAttestPassportPage(e.target.checked)} className="rounded text-rose-600" />
                                                            <span className={noticeAttestPassportPage ? 'font-bold text-rose-700' : 'text-slate-600'}>護照</span>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ================= 輸出區：依序五欄核心工作區 ================= */}
                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
                        {/* 欄 1: 應到場人 */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[390px]">
                            <div className="bg-slate-50 px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                                <span className="font-bold text-xs text-slate-700 flex items-center">
                                    <span className="w-2 h-2 rounded-full bg-blue-500 mr-1.5"></span>
                                    1. 應到場人
                                </span>
                                <div className="flex items-center space-x-1">
                                    {col1Edited && (
                                        <button onClick={()=>{setCol1Edited(false); setCol1Text(autoCol1);}} className="text-[10px] text-slate-400 hover:text-slate-700 underline">
                                            重設
                                        </button>
                                    )}
                                    <CopyBtn text={col1Text} label="複製" />
                                </div>
                            </div>
                            <div className="p-2 flex-1 flex flex-col">
                                <textarea
                                    value={col1Text}
                                    onChange={e => { setCol1Edited(true); setCol1Text(e.target.value); }}
                                    className="w-full h-full p-2.5 text-xs font-mono leading-relaxed rounded border border-slate-200 focus:border-blue-500 outline-none bg-slate-50/50"
                                />
                            </div>
                            <div className="px-3 py-2 bg-slate-50 border-t flex items-center justify-between text-xs">
                                <label className="inline-flex items-center space-x-1.5 cursor-pointer text-slate-700">
                                    <input
                                        type="checkbox"
                                        checked={includeCol1}
                                        onChange={e=>setIncludeCol1(e.target.checked)}
                                        className="rounded text-blue-600"
                                    />
                                    <span className="font-medium text-[11px]">加入總結果</span>
                                </label>
                                <span className="text-[10px] text-slate-400">{col1Edited ? '● 已修改' : '自動'}</span>
                            </div>
                        </div>

                        {/* 欄 2: 應備文件 */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[390px]">
                            <div className="bg-slate-50 px-3 py-2 border-b border-slate-200 flex items-center justify-between">
                                <span className="font-bold text-xs text-slate-700 flex items-center">
                                    <span className="w-2 h-2 rounded-full bg-indigo-500 mr-1.5"></span>
                                    2. 應備文件
                                </span>
                                <div className="flex items-center space-x-1">
                                    {col2Edited && (
                                        <button onClick={()=>{setCol2Edited(false); setCol2Text(autoCol2);}} className="text-[10px] text-slate-400 hover:text-slate-700 underline">
                                            重設
                                        </button>
                                    )}

                                <label className="inline-flex items-center space-x-1.5 cursor-pointer text-slate-700">
                                    <input

                                    />
                                    <span className="font-medium text-[11px]">加入總結果</span>
                                </label>
                                <span className="text-[10px] text-slate-400">{col3Edited ? '● 已修改' : '自動'}</span>

                        {/* 欄 4: 預約資訊 */}

                                <span className="font-bold text-xs text-slate-700 flex items-center">
